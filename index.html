:root{--bg:#0b0d10;--card:#14171c;--line:#232830;--txt:#f3f4f6;--dim:#8b93a1;--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
 --disp:"OswaldTC","Oswald","Bebas Neue","Impact","Arial Narrow",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);max-width:520px;margin:0 auto;min-height:100vh}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
header h1{margin:0;font-size:20px}
header h1 span{color:var(--green)}
#clock{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--dim);text-align:right;line-height:1.1}
#clock small{display:block;font-size:11px;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
#hero{text-align:center;padding:14px 12px 12px;border-width:2px;transition:border-color .3s}
#hero.st-in{border-color:var(--green)} #hero.st-break{border-color:var(--blue)} #hero.st-lunch{border-color:var(--amber)} #hero.st-out,#hero.st-none{border-color:var(--line)}
#status{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;background:#222831;color:var(--dim)}
.st-in #status{background:rgba(34,197,94,.15);color:var(--green)} .st-break #status{background:rgba(59,130,246,.15);color:#7fb0ff} .st-lunch #status{background:rgba(245,158,11,.15);color:var(--amber)} .st-out #status{background:rgba(239,68,68,.15);color:#ff8a8a}
#worked{font-family:var(--disp);font-weight:700;font-size:60px;line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
#workedLbl{font-size:12px;color:var(--dim);letter-spacing:.08em}
#cd{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#0f1a2e}
#cd.on{display:block}
#cd.lunch{background:#231a08}
#cdTitle{font-size:14px;color:var(--dim)}
#cdLeft{font-family:var(--disp);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
#cdSub{font-size:13px;color:var(--dim)}
#cdBar{height:8px;border-radius:9px;background:#262c36;margin-top:8px;overflow:hidden}
#cdBar i{display:block;height:100%;width:0;background:var(--blue);transition:width 1s linear}
#cd.lunch #cdBar i{background:var(--amber)}
#cd.warn{animation:flash .8s steps(2,start) infinite}
#cd.warn #cdLeft{color:var(--amber)}
#cd.late{background:#3a0d0d!important;animation:flash .5s steps(2,start) infinite}
#cd.late #cdLeft{color:#ff6b6b}
@keyframes flash{50%{background:#5b3a00;box-shadow:0 0 0 3px var(--amber) inset}}
#cd.late{--x:0}
body.flashAll::after{content:"";position:fixed;inset:0;background:rgba(255,255,255,.35);pointer-events:none;animation:fade 1.2s ease-out forwards}
@keyframes fade{to{opacity:0}}
#acts{display:grid;gap:10px;margin-bottom:10px}
.btn{appearance:none;border:0;border-radius:14px;padding:18px 10px;font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:#fff;width:100%;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.45);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.b-in{background:#16a34a} .b-out{background:#dc2626} .b-break{background:#2563eb} .b-lunch{background:#d97706}
.btn.big{padding:26px 10px;font-size:34px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{appearance:none;border:1px solid var(--line);background:#1b1f26;color:var(--txt);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
.small.arm{background:#7f1d1d;border-color:var(--red)}
#undoRow{display:flex;justify-content:center;margin:-2px 0 10px}
#undoRow .small{min-width:60%}
h2{margin:0 0 8px;font-size:15px;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline}
h2 b{color:var(--txt);font-size:17px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-weight:600}
.tl li:last-child{border-bottom:0}
.tl .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tl .t{font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tl .dur{color:var(--dim);font-size:12px;margin-left:6px;font-weight:500}
.empty{color:var(--dim);font-size:14px;padding:4px 2px}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.hist .d{color:var(--dim);font-weight:600;white-space:nowrap}
.hist .d.today{color:var(--green)}
.hist .bar{height:8px;background:#232830;border-radius:9px;overflow:hidden}
.hist .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.hist .h{font-family:var(--disp);font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
#pp{display:flex;justify-content:space-between;align-items:center}
#ppTot{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1}
#ppRange{color:var(--dim);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .small{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(120px);background:#e5e7eb;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:9;max-width:90%;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
footer{text-align:center;margin-top:18px;padding-bottom:6px}
footer .by{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.14em;color:#e5e7eb;text-transform:uppercase;line-height:1}
footer .ver{color:var(--dim);font-size:12px;margin-top:4px;letter-spacing:.04em}
#jsonBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:8;padding:calc(env(safe-area-inset-top) + 20px) 14px 20px}
#jsonBox.on{display:block}
#jsonBox textarea{width:100%;height:65vh;background:#0f1115;color:#d1d5db;border:1px solid var(--line);border-radius:10px;font:12px/1.3 ui-monospace,Menlo,monospace;padding:8px;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<header>
  <h1 class="disp">TimeClock <span>Live Lite</span></h1>
  <div id="clock">--:--<small id="dateLbl"></small></div>
</header>

<section id="hero" class="card st-none">
  <div id="status" class="disp">Not clocked in</div>
  <div id="worked">0:00:00</div>
  <div id="workedLbl" class="disp">Worked today</div>
  <div id="cd">
    <div id="cdTitle" class="disp">Break 1</div>
    <div id="cdLeft">15:00</div>
    <div id="cdSub">Back by --</div>
    <div id="cdBar"><i></i></div>
  </div>
</section>

<section id="acts"></section>
<div id="undoRow"></div>

<section class="card">
  <h2 class="disp">Today <b id="tlSum"></b></h2>
  <ul class="tl" id="tl"></ul>
</section>

<section class="card">
  <div id="pp">
    <div><div class="disp" style="color:var(--dim);font-size:13px">Pay period</div><div id="ppRange"></div></div>
    <div id="ppTot">0:00</div>
  </div>
</section>

<section class="card">
  <h2 class="disp">Last 7 days <b id="wkTot"></b></h2>
  <div class="hist" id="hist"></div>
</section>

<section class="card">
  <div class="tools">
    <button class="small" id="bExport">Export JSON</button>
    <button class="small" id="bImport">Import JSON</button>
    <button class="small" id="bView">View / Copy</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</section>

<footer>
  <div class="by">Design by Van</div>
  <div class="ver">v1.0.0 · Oct 3, 2026</div>
</footer>

<div id="jsonBox"><textarea id="jsonTxt" readonly></textarea>
  <div class="tools" style="margin-top:10px"><button class="small" id="bCopy">Copy</button><button class="small" id="bClose">Close</button></div></div>
<div id="toast"></div>

<script>
"use strict";
const APP="TimeClock Live Lite", VERSION="1.0.0", TZ="America/Chicago", KEY="punches";
const BREAK_SEC=15*60, BREAK_WARN=3*60, LUNCH_SEC=30*60, LUNCH_WARN=5*60;
const PP_ANCHOR="2026-09-26", PP_DAYS=14;
const $=id=>document.getElementById(id);

/* ---------- time (always Central, whatever the phone's zone) ---------- */
const fmtParts=new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function nowCT(){const o={};for(const p of fmtParts.formatToParts(new Date()))o[p.type]=p.value;
  const h=(+o.hour)%24;return {iso:`${o.year}-${o.month}-${o.day}`,sec:h*3600+(+o.minute)*60+(+o.second),y:+o.year,mo:+o.month,d:+o.day,h,mi:+o.minute,s:+o.second};}
const pad=n=>String(n).padStart(2,"0");
function tod12(sec){sec=Math.floor(sec);let h=Math.floor(sec/3600)%24,m=Math.floor(sec%3600/60);const ap=h<12?"AM":"PM";h=h%12||12;return `${h}:${pad(m)} ${ap}`;}
function todHMS(sec){if(sec==null)return null;sec=Math.floor(sec);return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;}
function hms(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/3600)}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;}
function hm(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/3600)}:${pad(Math.floor(sec%3600/60))}`;}
function ms(sec){const neg=sec<0;sec=Math.abs(Math.floor(sec));return (neg?"+":"")+`${Math.floor(sec/60)}:${pad(sec%60)}`;}
function isoToUTC(iso){const [y,m,d]=iso.split("-").map(Number);return Date.UTC(y,m-1,d);}
function utcToIso(t){const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}
function addDays(iso,n){return utcToIso(isoToUTC(iso)+n*86400000);}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dLabel(iso,withDow=true){const d=new Date(isoToUTC(iso));return (withDow?DOW[d.getUTCDay()]+" ":"")+`${d.getUTCMonth()+1}/${d.getUTCDate()}`;}

/* ---------- storage ---------- */
let P={};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||"{}");P=clean(j)||{};}catch(e){P={};}}
function save(){localStorage.setItem(KEY,punchJson());}
const KINDS=["in","out","bs","be","lo","li"];
function clean(obj){if(!obj||typeof obj!=="object")return null;const out={};
  for(const k of Object.keys(obj)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(obj[k]))continue;
    const l=obj[k].filter(e=>Array.isArray(e)&&KINDS.includes(String(e[0]))&&isFinite(+e[1])).map(e=>[String(e[0]),Math.max(0,Math.min(86399,Math.round(+e[1])))]);
    if(l.length)out[k]=l;}
  return out;}
function punchJson(){const ks=Object.keys(P).filter(k=>P[k]&&P[k].length).sort();
  return "{"+ks.map(k=>JSON.stringify(k)+":["+P[k].map(e=>`[${JSON.stringify(e[0])},${e[1]|0}]`).join(",")+"]").join(",")+"}";}

/* ---------- punch log -> day record (same rules as TimeClock Live / Paycheck Live) ---------- */
function rec(iso){const log=P[iso];if(!log||!log.length)return null;
  const r={In:null,Lo:null,Li:null,Out:null,Br:[],Gaps:[],LiAuto:false};let started=false;
  for(const [k,t] of log){const ob=(r.Br.length&&r.Br[r.Br.length-1].e==null)?r.Br[r.Br.length-1]:null;
    const lOpen=r.Lo!=null&&r.Li==null;
    if(k==="in"){if(!started){r.In=t;started=true;}
      else if(r.Out!=null){r.Gaps.push([r.Out,Math.max(t,r.Out),"off"]);r.Out=null;}
      else if(lOpen){r.Li=Math.max(t,r.Lo);}
      else if(ob){ob.e=Math.max(t,ob.s);ob.auto=true;}
      continue;}
    started=true;
    if(k==="bs"){if(ob){ob.e=Math.max(t,ob.s);ob.auto=true;}r.Br.push({s:t,e:null,auto:false});}
    else if(k==="be"){if(ob){ob.e=Math.max(t,ob.s);}}
    else if(k==="lo"){if(ob){ob.e=Math.max(t,ob.s);ob.auto=true;}if(r.Lo!=null&&r.Li!=null)r.Gaps.push([r.Lo,r.Li,"lunch"]);r.Lo=t;r.Li=null;}
    else if(k==="li"){if(lOpen)r.Li=Math.max(t,r.Lo);else if(r.Out!=null){r.Gaps.push([r.Out,Math.max(t,r.Out),"off"]);r.Out=null;}else if(r.Lo!=null)r.Li=Math.max(t,r.Lo);}
    else if(k==="out"){if(ob){ob.e=Math.max(t,ob.s);ob.auto=true;}if(lOpen){r.Li=Math.max(t,r.Lo);r.LiAuto=true;}r.Out=t;}
  }
  return r;}
/* worked seconds: clock-in .. clock-out (or now), minus unpaid lunch and off-the-clock gaps; 15-min breaks are paid */
function workedSec(iso,nowSec){const r=rec(iso);if(!r)return 0;const start=r.In!=null?r.In:(P[iso][0]&&P[iso][0][1]);if(start==null)return 0;
  const live=nowSec!=null;const end=r.Out!=null?r.Out:(live?nowSec:null);if(end==null)return 0;
  let w=Math.max(0,end-start);const clip=(a,b)=>Math.max(0,Math.min(b,end)-Math.max(a,start));
  for(const g of r.Gaps)w-=clip(g[0],g[1]);
  if(r.Lo!=null){const le=r.Li!=null?r.Li:(r.Out!=null?r.Out:(live?nowSec:r.Lo));w-=clip(r.Lo,le);}
  return Math.max(0,w);}
function state(iso){const r=rec(iso);if(!r)return {k:"none",r};
  if(r.Out!=null)return {k:"out",r};
  const ob=r.Br.length&&r.Br[r.Br.length-1].e==null?r.Br[r.Br.length-1]:null;
  if(r.Lo!=null&&r.Li==null)return {k:"lunch",r};
  if(ob)return {k:"break",r,ob,n:r.Br.length};
  return {k:"in",r};}

/* ---------- alerts ---------- */
let actx=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A();}if(actx&&actx.state==="suspended")actx.resume();}catch(e){}}
function beep(times,freq){if(!actx)return;try{for(let i=0;i<times;i++){const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*0.32;
  o.type="square";o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
  o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+0.25);}}catch(e){}}
function alarm(level){ // level: "warn" | "zero"
  if(navigator.vibrate)try{navigator.vibrate(level==="zero"?[400,150,400,150,700]:[250,120,250]);}catch(e){}
  beep(level==="zero"?5:3,level==="zero"?1046:880);
  document.body.classList.remove("flashAll");void document.body.offsetWidth;document.body.classList.add("flashAll");
  toast(level==="zero"?"Time's up — punch back in!":"Heads up — almost time");}
function fired(key){const k="tcl-fired";let s;try{s=JSON.parse(sessionStorage.getItem(k)||"[]");}catch(e){s=[];}
  if(s.includes(key))return true;s.push(key);sessionStorage.setItem(k,JSON.stringify(s.slice(-40)));return false;}

/* ---------- actions ---------- */
function punch(kind){unlockAudio();const n=nowCT();(P[n.iso]=P[n.iso]||[]).push([kind,n.sec]);save();disarmUndo();render();
  toast(({in:"Clocked in",out:"Clocked out",bs:"Break started",be:"Break ended",lo:"Lunch started",li:"Back from lunch"})[kind]+" · "+tod12(n.sec));
  if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}}
let undoArmed=0;
function disarmUndo(){undoArmed=0;}
function undo(){const n=nowCT();const l=P[n.iso];if(!l||!l.length)return;
  if(!undoArmed||Date.now()-undoArmed>4000){undoArmed=Date.now();render();setTimeout(()=>{if(undoArmed&&Date.now()-undoArmed>=4000){undoArmed=0;render();}},4100);return;}
  const e=l.pop();if(!l.length)delete P[n.iso];save();undoArmed=0;render();toast("Undid "+labelFor(e[0],null)+" ("+tod12(e[1])+")");}
function labelFor(k,n){return ({in:"Clock In",out:"Clock Out",bs:`Break${n?" "+n:""} Start`,be:`Break${n?" "+n:""} End`,lo:"Lunch Out",li:"Lunch In"})[k];}

/* ---------- render ---------- */
const COLORS={in:"var(--green)",out:"var(--red)",bs:"var(--blue)",be:"var(--blue)",lo:"var(--amber)",li:"var(--amber)"};
function btn(cls,txt,kind){const b=document.createElement("button");b.className="btn "+cls;b.textContent=txt;b.dataset.k=kind;b.onclick=()=>punch(kind);return b;}
let lastStateKey="";
function render(){const n=nowCT(),iso=n.iso,st=state(iso),r=st.r;
  $("clock").firstChild.nodeValue=tod12(n.sec);
  $("dateLbl").textContent=dLabel(iso)+" · CT";
  const hero=$("hero");hero.className="card st-"+st.k;
  const breaksDone=r?r.Br.length:0,lunchDone=r&&r.Lo!=null;
  $("status").textContent=({none:"Not clocked in",in:"On the clock",break:`On break ${st.n||""}`,lunch:"At lunch",out:"Clocked out"})[st.k];
  const w=workedSec(iso,n.sec);$("worked").textContent=hms(w);
  // countdown
  const cd=$("cd");
  if(st.k==="break"||st.k==="lunch"){const isL=st.k==="lunch",s0=isL?r.Lo:st.ob.s,len=isL?LUNCH_SEC:BREAK_SEC,warnAt=isL?LUNCH_WARN:BREAK_WARN;
    const left=len-(n.sec-s0);cd.className="on"+(isL?" lunch":"")+(left<=0?" late":left<=warnAt?" warn":"");
    $("cdTitle").textContent=isL?"Lunch · 30 min":`Break ${st.n} · 15 min`;
    $("cdLeft").textContent=left<=0?"LATE "+ms(left):ms(left);
    $("cdSub").textContent="Back by "+tod12(s0+len)+" · gone "+ms(n.sec-s0);
    $("cdBar").firstChild.style.width=Math.min(100,(n.sec-s0)/len*100)+"%";
    const key=iso+":"+st.k+":"+s0;
    if(left<=warnAt&&left>0&&!fired(key+":warn"))alarm("warn");
    if(left<=0&&left>-60&&!fired(key+":zero"))alarm("zero");
  }else cd.className="";
  // buttons
  const sk=st.k+"|"+breaksDone+"|"+lunchDone+"|"+(P[iso]?P[iso].length:0)+"|"+undoArmed;
  if(sk!==lastStateKey){lastStateKey=sk;const a=$("acts");a.innerHTML="";
    if(st.k==="none")a.appendChild(btn("b-in big","Clock In","in"));
    else if(st.k==="out")a.appendChild(btn("b-in","Clock Back In","in"));
    else if(st.k==="break")a.appendChild(btn("b-break big",`Break ${st.n} End`,"be"));
    else if(st.k==="lunch")a.appendChild(btn("b-lunch big","Lunch In","li"));
    else{const row=document.createElement("div");row.className="row2";
      if(breaksDone<2)row.appendChild(btn("b-break",`Break ${breaksDone+1} Start`,"bs"));
      if(!lunchDone)row.appendChild(btn("b-lunch","Lunch Out","lo"));
      if(row.children.length===1)row.style.gridTemplateColumns="1fr";
      if(row.children.length)a.appendChild(row);
      a.appendChild(btn("b-out","Clock Out","out"));}
    const u=$("undoRow");u.innerHTML="";
    if(P[iso]&&P[iso].length){const last=P[iso][P[iso].length-1];const b=document.createElement("button");b.className="small"+(undoArmed?" arm":"");b.id="bUndo";
      b.textContent=undoArmed?"Tap again to undo "+labelFor(last[0])+" "+tod12(last[1]):"↶ Undo last punch";b.onclick=undo;u.appendChild(b);}
    renderTimeline(iso);}
  renderHistory(iso,n.sec);}
function renderTimeline(iso,nowSec){const tl=$("tl");tl.innerHTML="";const l=P[iso]||[];
  if(!l.length){tl.innerHTML='<li class="empty">No punches yet today.</li>';$("tlSum").textContent="";return;}
  let bn=0,ins=0,lastBs=null,lastLo=null;
  for(const [k,t] of l){let lbl,dur="";
    if(k==="bs"){bn++;lastBs=t;lbl=labelFor("bs",bn);}
    else if(k==="be"){lbl=labelFor("be",bn);if(lastBs!=null)dur=ms(t-lastBs);lastBs=null;}
    else if(k==="lo"){lastLo=t;lbl="Lunch Out";}
    else if(k==="li"){lbl="Lunch In";if(lastLo!=null)dur=ms(t-lastLo);lastLo=null;}
    else if(k==="in"){ins++;lbl=ins>1?"Clock In (back)":"Clock In";}
    else lbl="Clock Out";
    const li=document.createElement("li");const L=document.createElement("span");const dot=document.createElement("i");dot.className="dot";dot.style.background=COLORS[k];
    L.appendChild(dot);L.appendChild(document.createTextNode(lbl));if(dur){const d=document.createElement("span");d.className="dur";d.textContent=dur;L.appendChild(d);}
    const T=document.createElement("span");T.className="t";T.textContent=tod12(t);li.appendChild(L);li.appendChild(T);tl.appendChild(li);}
  const r=rec(iso);$("tlSum").textContent=r?`${Math.min(2,r.Br.length)}/2 breaks · ${r.Lo!=null?"1":"0"}/1 lunch`:"";}
function renderHistory(today,nowSec){const h=$("hist");h.innerHTML="";let wk=0;const rows=[];
  for(let i=0;i<7;i++){const iso=addDays(today,-i);const s=workedSec(iso,iso===today?nowSec:null);wk+=s;rows.push([iso,s]);}
  for(const [iso,s] of rows){const d=document.createElement("div");d.className="d"+(iso===today?" today":"");d.textContent=(iso===today?"Today ":"")+dLabel(iso,iso!==today);
    const b=document.createElement("div");b.className="bar";const i=document.createElement("i");i.style.width=Math.min(100,s/36000*100)+"%";b.appendChild(i);
    const v=document.createElement("div");v.className="h";v.textContent=s?hm(s):"—";h.append(d,b,v);}
  $("wkTot").textContent=hm(wk);
  // pay period
  const idx=Math.floor((isoToUTC(today)-isoToUTC(PP_ANCHOR))/86400000/PP_DAYS);const ps=addDays(PP_ANCHOR,idx*PP_DAYS),pe=addDays(ps,PP_DAYS-1);
  let tot=0;for(let i=0;i<PP_DAYS;i++){const iso=addDays(ps,i);if(iso>today)break;tot+=workedSec(iso,iso===today?nowSec:null);}
  $("ppTot").textContent=hm(tot);const y=x=>x.slice(0,4);
  $("ppRange").textContent=`${dLabel(ps,false)}/${y(ps)} – ${dLabel(pe,false)}/${y(pe)}`;}

/* ---------- export / import ---------- */
function daySummaries(){const n=nowCT(),out={};
  for(const k of Object.keys(P).sort()){const r=rec(k);if(!r)continue;const live=k===n.iso;
    const seg=(s,e)=>s==null?null:{start:todHMS(s),end:todHMS(e),sec:e!=null?e-s:(live?n.sec-s:null),open:e==null};
    out[k]={clockIn:todHMS(r.In),clockOut:todHMS(r.Out),break1:r.Br[0]?seg(r.Br[0].s,r.Br[0].e):null,break2:r.Br[1]?seg(r.Br[1].s,r.Br[1].e):null,
      lunch:r.Lo!=null?seg(r.Lo,r.Li):null,breakCount:Math.min(2,r.Br.length),workedMin:Math.floor(workedSec(k,live?n.sec:null)/60)};}
  return out;}
function exportDoc(){const n=nowCT();const saved=`${n.iso} ${pad(n.h)}:${pad(n.mi)}:${pad(n.s)}`;
  const doc={app:APP,version:VERSION,saved,punches:"__PUNCHES__",days:daySummaries()};
  return JSON.stringify(doc,null,2).replace('"__PUNCHES__"',punchJson());}
function doExport(){const txt=exportDoc();const blob=new Blob([txt],{type:"application/json"});
  const file=typeof File==="function"?new File([blob],"timeclock-data.json",{type:"application/json"}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({files:[file],title:"timeclock-data.json"}).catch(()=>{});return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="timeclock-data.json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("Exported timeclock-data.json");}
function doImport(file){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(String(fr.result).replace(/^\uFEFF/,""));
    const src=j&&j.punches&&typeof j.punches==="object"?j.punches:j;const c=clean(src);
    if(!c||!Object.keys(c).length){toast("No punches found in that file");return;}
    const days=Object.keys(c).length;if(!confirm(`Import ${days} day(s) of punches? Matching dates on this phone will be replaced.`))return;
    Object.assign(P,c);save();lastStateKey="";render();toast(`Imported ${days} day(s)`);}catch(e){toast("Not a valid JSON file");}};fr.readAsText(file);}

let tt=0;function toast(s){const t=$("toast");t.textContent=s;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600);}

$("bExport").onclick=doExport;
$("bImport").onclick=()=>$("fileIn").click();
$("fileIn").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value="";};
$("bView").onclick=()=>{$("jsonTxt").value=exportDoc();$("jsonBox").classList.add("on");};
$("bClose").onclick=()=>$("jsonBox").classList.remove("on");
$("bCopy").onclick=()=>{const t=$("jsonTxt");(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast("Copied"),()=>{t.select();document.execCommand("copy");toast("Copied");});};
document.addEventListener("touchstart",unlockAudio,{passive:true});document.addEventListener("click",unlockAudio);
window.addEventListener("storage",e=>{if(e.key===KEY){load();lastStateKey="";render();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();lastStateKey="";render();}});

load();render();
setInterval(render,1000);
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
